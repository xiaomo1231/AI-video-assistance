name: 打包墨剪

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: mojian-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
          if-no-files-found: warn
